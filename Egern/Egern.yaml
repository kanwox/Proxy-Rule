rules:
  # 防止代理回环
  - ip_cidr:
      match: 127.0.0.0/8
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: 0.0.0.0/32
      policy: REJECT
      no_resolve: true
  - ip_cidr6:
      match: "::1/128"
      policy: REJECT
      no_resolve: true
  - ip_cidr6:
      match: "::/128"
      policy: REJECT
      no_resolve: true
  - rule_set:
      match: "https://cdn.jsdmirror.com/gh/Repcz/Tool@X/Egern/Rules/Lan.yaml"
      policy: DIRECT
      update_interval: 604800
  - rule_set:
      match: "https://cdn.jsdmirror.com/gh/Repcz/Tool@X/Egern/Rules/Reject.yaml"
      policy: REJECT
      update_interval: 604800
  - rule_set:
