rules:
  # 防止代理回环
  - ip_cidr:
      match: 127.0.0.0/8
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: 0.0.0.0/32
      policy: REJECT
      no_resolve: true
  - ip_cidr6:
      match: "::1/128"
      policy: REJECT
      no_resolve: true
  - ip_cidr6:
      match: "::/128"
      policy: REJECT
      no_resolve: true
  # 局域网/私网内联规则（IP 规则加 no_resolve 避免触发同步 DNS 解析）
  - domain_suffix:
      match: local
      policy: DIRECT
  - domain_suffix:
      match: lan
      policy: DIRECT
  - domain_suffix:
      match: home
      policy: DIRECT
  - domain_suffix:
      match: home.arpa
      policy: DIRECT
  - ip_cidr:
      match: 10.0.0.0/8
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 100.64.0.0/10
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 169.254.0.0/16
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 172.16.0.0/12
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 192.168.0.0/16
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 224.0.0.0/4
      policy: DIRECT
      no_resolve: true
  - ip_cidr6:
      match: "fc00::/7"
      policy: DIRECT
      no_resolve: true
  - ip_cidr6:
      match: "fe80::/10"
      policy: DIRECT
      no_resolve: true
  - rule_set:
      match: "https://cdn.jsdmirror.com/gh/Repcz/Tool@X/Egern/Rules/Reject.yaml"
      policy: REJECT
      update_interval: 604800
  # 海外 DoH 强制经主代理出站，避免兜底设为 DIRECT 时解析失效
  - ip_cidr:
      match: 1.1.1.1/32
      policy: 主代理
      no_resolve: true
  - ip_cidr:
      match: 8.8.8.8/32
      policy: 主代理
      no_resolve: true
  # Synology（同步自 v2fly/domain-list-community synology）
