# push / PR 时运行 scripts/verify.mjs（零外部依赖）
name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # import.meta.dirname 需 Node >= 20.11
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run verify
        run: node scripts/verify.mjs