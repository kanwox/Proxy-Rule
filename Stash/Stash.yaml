# 使用说明：将 proxy-providers.All.url 中的「订阅链接填写处」替换为真实订阅链接。
mode: rule

proxy-providers:
  All:
    url: "订阅链接填写处"
    interval: 86400
    path: ./all.yaml
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5
    filter: '(?i)^(?!.*(剩余|官网|套餐|已用|到期|过期|重置|更新|刷新|订阅|通知|本站|网址|客服|欢迎|Expire|Traffic|Reset|(剩余|已用|可用|查询|超出|总)流量|流量([:：]|\s*(剩余|已用|可用|重置|耗尽|不足|提醒|查询|统计|清零))|(到期|过期|剩余|重置|更新|刷新|有效)时间|时间[:：]|(官网|最新|发布|永久|备用|防失联|防走丢)地址|地址[:：]|有效期|有效至|(QQ|TG|Telegram|电报|交流|官方|通知|用户)群|群([:：|｜\s]|$)|加群|入群|群聊|群号|群组|群链接|加入(我们|群|TG|电报|频道|Telegram|QQ)|防(失联|走丢)|(^|[^A-Za-z0-9])(\d+\s*Days?|(Data|Used|Left|Remain|Quota)\s*[:：\s]*\d+(\.\d+)?\s*(GB|TB)|\d+(\.\d+)?\s*(GB|TB)\s*/\s*\d+(\.\d+)?\s*(GB|TB))([^A-Za-z0-9]|$))).*$'

dns:
  fake-ip-range: 198.18.0.1/16
  # 解析下列加密 DNS 服务器域名用，除 system 外必须是 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  # 注：Stash 不支持 rcode:// 否定回答；iOS 3.7+ / macOS 4.4+ 可在下方 ads-domain 规则追加 ,pre-matching 实现 DNS 层拦截
  nameserver-policy:
    'rule-set:private-domain':
      - system
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  fake-ip-filter:
    - 'rule-set:cn-domain'
    - 'rule-set:private-domain'
    - '+.ntp.org'
    - '+.stun.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    - 'time.apple.com'
    - 'time.asia.apple.com'
    - 'time.windows.com'
    - 'time.android.com'
    - 'time.nist.gov'
    - 'ntp.aliyun.com'
    - 'ntp.tencent.com'
    - 'ntp.ntsc.ac.cn'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - 'localhost.work.weixin.qq.com'
    - '+.xboxlive.com'
    - '+.playstation.net'
    - '+.xbox.com'
    - 'xbox.ipv6.microsoft.com'
    - '+.srv.nintendo.net'

