# 使用说明：将 [server_remote] 中的「订阅链接填写处」替换为真实订阅链接。
[general]
server_check_url = https://www.gstatic.com/generate_204
server_check_timeout = 5000
network_check_url = http://wifi.vivo.com.cn/generate_204
fallback_udp_policy = reject
dns_reject_domain_behavior = nxdomain
resource_parser_url = https://cdn.jsdmirror.com/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
dns_exclusion_list = *.lan, *.local, *.home.arpa, *.ntp.org, time.apple.com, time.asia.apple.com, time.windows.com, time.android.com, time.nist.gov, ntp.aliyun.com, ntp.tencent.com, ntp.ntsc.ac.cn, *.msftconnecttest.com, *.msftncsi.com, localhost.ptlogin2.qq.com, localhost.sec.qq.com, localhost.work.weixin.qq.com, *.stun.*, *.stun.playstation.net, *.xboxlive.com, *.playstation.net, *.xbox.com, xbox.ipv6.microsoft.com, *.srv.nintendo.net, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me
excluded_routes = 127.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 169.254.0.0/16

[dns]
; 未设置 no-ipv6，默认启用 IPv6 解析
doh-server = https://223.5.5.5/dns-query, https://1.12.12.12/dns-query
; 私有局域网域名走系统 DNS
server = /*.lan/system
server = /*.local/system
server = /*.home.arpa/system
server = /*.home/system

[server_remote]
订阅链接填写处, tag=All, update-interval=86400, opt-parser=true, enabled=true

[policy]
static = 主代理, HK, JP, SG, TW, US, 静态, direct, img-url=https://cdn.jsdmirror.com/gh/Koolson/Qure@master/IconSet/Color/Proxy.png

static = 静态, resource-tag-regex=^All$, server-tag-regex=(?i)^(?!.*(剩余|官网|套餐|已用|到期|过期|重置|更新|刷新|订阅|通知|本站|网址|客服|欢迎|Expire|Traffic|Reset|(剩余|已用|可用|查询|超出|总)流量|流量([:：]|\s*(剩余|已用|可用|重置|耗尽|不足|提醒|查询|统计|清零))|(到期|过期|剩余|重置|更新|刷新|有效)时间|时间[:：]|(官网|最新|发布|永久|备用|防失联|防走丢)地址|地址[:：]|有效期|有效至|(QQ|TG|Telegram|电报|交流|官方|通知|用户)群|群([:：|｜\s]|$)|加群|入群|群聊|群号|群组|群链接|加入(我们|群|TG|电报|频道|Telegram|QQ)|防(失联|走丢)|(^|[^A-Za-z0-9])(\d+\s*Days?|(Data|Used|Left|Remain|Quota)\s*[:：\s]*\d+(\.\d+)?\s*(GB|TB)|\d+(\.\d+)?\s*(GB|TB)\s*/\s*\d+(\.\d+)?\s*(GB|TB))([^A-Za-z0-9]|$))).*$, img-url=https://cdn.jsdmirror.com/gh/Koolson/Qure@master/IconSet/Color/Static.png

